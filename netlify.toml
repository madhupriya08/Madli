# Netlify build + hosting config.
#
# Committed rather than left to Netlify's framework auto-detection so a deploy
# behaves the same whichever account or team the site is connected to.
#
# Environment variables are NOT set here — they are secrets and belong in
# Netlify's own "Environment variables" UI. Note that Vite inlines every
# VITE_-prefixed variable into the bundle at BUILD time (it is a text
# substitution, not a runtime lookup), so adding or changing one in the UI has
# no effect on an already-published deploy: a rebuild is required. See
# .env.example for the full list the app expects.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned so CI, local dev and Netlify agree. Vite 5 + TypeScript 6 need >= 20.
  NODE_VERSION = "22"

# SPA fallback. The app is a client-side React Router build with one real HTML
# entry point, so every unmatched path must serve index.html and let the router
# resolve it. Without this, a hard refresh or a pasted deep link (e.g.
# /results/eat, or a shared /plans/<token> link — the one URL the product
# expects strangers to open cold) returns Netlify's 404 instead of the app.
# Status 200, not 301: the URL must stay as typed for the router to read it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
