<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-page);font:var(--type-body)}.g{display:flex;gap:8px}.lbl{font:var(--type-evidence);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);padding:8px;box-sizing:border-box}.sw b{font:var(--type-evidence);font-weight:var(--weight-demi);letter-spacing:0.02em}.sw span{font:var(--type-evidence);opacity:.72}</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:12px"><div style="width:74px" class="lbl">instant</div><div style="width:56.25px;height:8px;background:var(--teal-400);border-radius:var(--radius-pill)"></div><div style="font:var(--type-caption);color:var(--text-muted)">90ms — colour and press feedback</div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:74px" class="lbl">fast</div><div style="width:87.5px;height:8px;background:var(--teal-400);border-radius:var(--radius-pill)"></div><div style="font:var(--type-caption);color:var(--text-muted)">140ms — hover, focus, toggles</div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:74px" class="lbl">base</div><div style="width:125px;height:8px;background:var(--teal-400);border-radius:var(--radius-pill)"></div><div style="font:var(--type-caption);color:var(--text-muted)">200ms — content fade-up, toasts</div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:74px" class="lbl">sheet</div><div style="width:162.5px;height:8px;background:var(--teal-400);border-radius:var(--radius-pill)"></div><div style="font:var(--type-caption);color:var(--text-muted)">260ms — bottom sheets</div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:74px" class="lbl">slow</div><div style="width:200px;height:8px;background:var(--teal-400);border-radius:var(--radius-pill)"></div><div style="font:var(--type-caption);color:var(--text-muted)">320ms — full-screen transitions</div></div>
<div class="lbl" style="margin-top:6px">--ease-standard cubic-bezier(.2,0,.2,1) for everything; --ease-out only for things entering</div>
</div></body></html>
