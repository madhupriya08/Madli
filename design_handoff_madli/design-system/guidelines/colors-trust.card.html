<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-page);font:var(--type-body)}.g{display:flex;gap:8px}.lbl{font:var(--type-evidence);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:72px;border-radius:var(--radius-md);padding:8px;box-sizing:border-box}.sw b{font:var(--type-evidence);font-weight:var(--weight-demi);letter-spacing:0.02em}.sw span{font:var(--type-evidence);opacity:.72}</style></head><body><div class="g">
<div class="sw" style="background:var(--rank-1);color:#fff"><b>rank-1</b><span>teal-500</span></div>

<div class="sw" style="background:var(--rank-3);color:#fff"><b>rank-3</b><span>slate-400</span></div>
</div><div class="g" style="margin-top:8px">
