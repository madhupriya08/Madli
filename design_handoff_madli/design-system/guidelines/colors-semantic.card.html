<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Emerald confirms, amber cautions, red only for real failures" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-page);font:var(--type-body)}.g{display:flex;gap:8px}.lbl{font:var(--type-evidence);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-md);padding:8px;box-sizing:border-box}.sw b{font:var(--type-evidence);font-weight:var(--weight-demi);letter-spacing:0.02em}.sw span{font:var(--type-evidence);opacity:.72}</style></head><body><div class="g">
<div class="sw" style="background:var(--emerald-500);color:#fff"><b>success · emerald</b><span>#10B981</span></div>
<div class="sw" style="background:var(--status-success-bg);color:var(--status-success-fg)"><b>success bg</b><span>#ECFDF5</span></div>
<div class="sw" style="background:var(--amber-500);color:#fff"><b>warn · amber</b><span>#F59E0B</span></div>
<div class="sw" style="background:var(--status-warn-bg);color:var(--status-warn-fg)"><b>warn bg</b><span>#FFFBEB</span></div>
<div class="sw" style="background:var(--red-500);color:#fff"><b>error</b><span>#E11D48</span></div>
<div class="sw" style="background:var(--status-error-bg);color:var(--status-error-fg)"><b>error bg</b><span>#FEF2F2</span></div>
<div class="sw" style="background:var(--sky-50);color:var(--status-info-fg)"><b>info bg</b><span>#EEF9FF</span></div>
</div></body></html>
