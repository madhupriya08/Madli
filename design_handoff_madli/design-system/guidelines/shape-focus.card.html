<!-- @dsCard group="Spacing" viewport="700x150" name="Focus & press" subtitle="3px teal ring on focus; press settles 1px down, never scales" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-page);font:var(--type-body)}.g{display:flex;gap:8px}.lbl{font:var(--type-evidence);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);padding:8px;box-sizing:border-box}.sw b{font:var(--type-evidence);font-weight:var(--weight-demi);letter-spacing:0.02em}.sw span{font:var(--type-evidence);opacity:.72}</style></head><body><div style="display:flex;gap:16px;align-items:center">
<div style="height:44px;padding:0 20px;display:flex;align-items:center;border-radius:var(--radius-md);background:var(--action-primary);color:#fff;font:var(--type-label);box-shadow:var(--shadow-focus)">Focused · --shadow-focus</div>
<div style="height:44px;padding:0 20px;display:flex;align-items:center;border-radius:var(--radius-md);background:var(--action-accent);color:#fff;font:var(--type-label);box-shadow:var(--shadow-focus-coral)">Coral focus</div>
<div style="height:44px;padding:0 20px;display:flex;align-items:center;border-radius:var(--radius-md);background:var(--action-primary-active);color:#fff;font:var(--type-label);transform:translateY(1px)">Pressed · translateY(1px)</div>
</div></body></html>
