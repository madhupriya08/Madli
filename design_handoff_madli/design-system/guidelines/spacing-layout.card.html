<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-page);font:var(--type-body)}.g{display:flex;gap:8px}.lbl{font:var(--type-evidence);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);color:var(--text-faint)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:0px;border-radius:var(--radius-md);padding:8px;box-sizing:border-box}.sw b{font:var(--type-evidence);font-weight:var(--weight-demi);letter-spacing:0.02em}.sw span{font:var(--type-evidence);opacity:.72}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<div><div class="lbl">--content-max 1160</div><div style="height:10px;background:var(--teal-500);border-radius:var(--radius-pill);width:100%"></div></div>
<div><div class="lbl">--prose-max 66ch</div><div style="height:10px;background:var(--teal-400);border-radius:var(--radius-pill);width:66%"></div></div>
<div><div class="lbl">--reason-max 46ch · the reason text always gets this much room</div><div style="height:10px;background:var(--action-accent);border-radius:var(--radius-pill);width:46%"></div></div>
<div><div class="lbl">--app-frame-width 390 · phone design width</div><div style="height:10px;background:var(--slate-400);border-radius:var(--radius-pill);width:33%"></div></div>
</div></body></html>
