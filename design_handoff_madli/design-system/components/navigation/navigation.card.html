<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg-page);padding:20px}.frame{width:330px;border:1px solid var(--border-hairline);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-card)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { TopBar, TabBar, Tabs, IconButton } = window.MadliDesignSystem_b70beb;
function Demo(){
  const [tab,setTab]=React.useState("picks"),[scope,setScope]=React.useState("eat");
  return <div style={{display:"flex",gap:22,alignItems:"flex-start"}}>
    <div className="frame">
      <TopBar title="Kadıköy" subtitle="3 picks · updated 2h ago" sticky={false} trailing={<IconButton icon="sliders-horizontal" label="Filters"/>}/>
      <div style={{height:70,display:"flex",alignItems:"center",justifyContent:"center",font:"var(--type-caption)",color:"var(--text-faint)"}}>content</div>
      <TabBar value={tab} onChange={setTab} items={[{value:"picks",label:"Picks",icon:"sparkles"},{value:"map",label:"Map",icon:"map"},{value:"saved",label:"Saved",icon:"bookmark"},{value:"you",label:"You",icon:"user"}]}/>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <Tabs items={[{value:"eat",label:"Eat"},{value:"do",label:"Do"},{value:"stay",label:"Stay"}]} value={scope} onChange={setScope}/>
      <Tabs size="sm" items={[{value:"eat",label:"Locals"},{value:"do",label:"Everyone"}]} value={scope==="eat"?"eat":"do"} onChange={setScope}/>
      <TopBar title="How this was ranked" onBack={()=>{}} sticky={false} style={{border:"1px solid var(--border-hairline)",borderRadius:"var(--radius-md)",width:300}}/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
