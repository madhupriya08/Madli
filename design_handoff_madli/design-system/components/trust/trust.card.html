<!-- @dsCard group="Components" viewport="700x400" name="Trust" subtitle="PickCard, rank badges, gaps, sample sizes, reasons" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg-page);padding:20px}.lbl{font:var(--type-evidence);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);color:var(--text-faint)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { PickCard, RankBadge, RankGap, SampleSize, ReasonNote } = window.MadliDesignSystem_b70beb;
function Demo(){
  return <div style={{display:"grid",gridTemplateColumns:"300px 1fr",gap:22,alignItems:"start"}}>
    <PickCard rank={1} name="Çiya Sofrası" category="Anatolian" neighborhood="Kadıköy" priceLevel="₺₺"
      reason="Locals rank it first for a sit-down lunch: the stews change daily and nothing is over 200₺."
      gapTone="clear" gapPoints={11} locals={412} visitors={88} photoLabel="Çiya Sofrası"/>
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div><div className="lbl">Rank badges</div><div style={{display:"flex",gap:8,marginTop:8,alignItems:"center"}}><RankBadge rank={1}/><RankBadge rank={2}/><RankBadge rank={3}/><RankBadge rank={1} variant="outline"/><RankBadge rank={1} size="lg"/><RankBadge rank={2} size="sm"/></div></div>
      <div><div className="lbl">Ranking gaps — stated, not smoothed over</div><div style={{display:"flex",flexDirection:"column",gap:10,marginTop:8,maxWidth:320}}>
        <RankGap tone="clear" points={11}/><RankGap tone="close" note="Nearly tied with #2 — either works"/><RankGap tone="thin" note="Only 22 ratings — treat as a hint"/></div></div>
      <div><div className="lbl">Sample size</div><div style={{marginTop:6}}><SampleSize locals={412} visitors={88}/><SampleSize locals={51} window="last 30 days" extra="82% within 1km"/></div></div>
      <ReasonNote tone="gem" label="Why this is a gem">Nine tables, no sign, and 84% of the people rating it live within a kilometre.</ReasonNote>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
